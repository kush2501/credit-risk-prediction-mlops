artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_file: data/credit_risk.csv
  raw_data_path: artifacts/data_ingestion/credit_risk.csv

data_validation:
  root_dir: artifacts/data_validation
  STATUS_FILE: artifacts/data_validation/status.txt

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/credit_risk.csv
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  preprocessor_path: artifacts/data_transformation/preprocessor.pkl

model_trainer:
  root_dir: artifacts/model_training
  trained_model_path: artifacts/model_training/model.pkl

model_evaluation:
  minimum_f1_score: 0.80
  evaluation_metrics_path: artifacts/model_evaluation/evaluation_metrics.json
  
model_experimentation:
  root_dir: artifacts/model_experimentation
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  best_model_path: artifacts/model_experimentation/best_model.pkl

model_registry:
  root_dir: artifacts/model_registry
  model_name: CreditRiskModel
  mlflow_model_uri_path: artifacts/model_experimentation/model_uri.txt
  evaluation_metrics_path: artifacts/model_evaluation/evaluation_metrics.json
